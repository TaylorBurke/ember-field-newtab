<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="field"></canvas>

<div class="ntp-center">
  <form class="search" id="searchForm" autocomplete="off">
    <button type="button" class="search-caret" id="searchCaretBtn" aria-label="Change search service" title="Change search service">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <input class="search-input" type="search" name="q" placeholder="Search" aria-label="Search" autofocus>
    <button class="search-submit" type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </form>

  <div class="shortcuts-row">
    <div class="shortcuts" id="shortcuts"></div>
    <button class="add-shortcut" id="addShortcutBtn" type="button" aria-label="Add shortcut" title="Add shortcut">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="recent-tabs" id="recentTabs" hidden>
    <span class="recent-tabs-label">Recently closed</span>
    <div class="recent-tabs-list" id="recentTabsList"></div>
  </div>
</div>

<div class="favorites-edit">
  <button type="button" id="editFavoritesBtn" class="edit-link" hidden>Edit favorites</button>
</div>

<button type="button" id="paletteBtn" class="palette-btn" aria-label="Change color palette" title="Change color palette">
  <span id="paletteBtnSwatch" class="palette-btn-swatch"></span>
</button>

<dialog class="add-dialog" id="addDialog">
  <form id="addForm" class="add-form">
    <label for="shortcutUrl">Add shortcut</label>
    <input type="text" id="shortcutUrl" placeholder="example.com" autocomplete="off" required>
    <p class="add-form-error" id="shortcutError" hidden>That doesn't look like a website address.</p>
    <div class="add-form-actions">
      <button type="button" id="cancelAdd" class="btn-ghost">Cancel</button>
      <button type="submit" class="btn-solid">Add</button>
    </div>
  </form>
</dialog>

<dialog class="add-dialog" id="paletteDialog">
  <label class="palette-dialog-label">Color palette</label>
  <div id="paletteList" class="palette-list"></div>
</dialog>

<dialog class="add-dialog" id="searchServiceDialog">
  <label class="palette-dialog-label">Search service</label>
  <p class="search-service-hint">Display only — search still goes through your browser's actual default search engine, set in Chrome's own settings.</p>
  <div id="searchServiceList" class="palette-list"></div>
</dialog>

<script src="main.js"></script>
<script src="palettes.js"></script>
<script src="app.js"></script>
<script src="shortcuts.js"></script>
<script src="palette-picker.js"></script>
<script src="search-picker.js"></script>
<script src="recent-tabs.js"></script>
<script src="search.js"></script>
</body>
</html>
